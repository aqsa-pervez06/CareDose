<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#075e5a">
    <title>CareDose</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #17352b;
        background: #f5f8f6;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
      }

      * { box-sizing: border-box; }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        background:
          radial-gradient(ellipse at 12% 18%, #dcefe5 0, transparent 34%),
          radial-gradient(ellipse at 92% 84%, #e1eee8 0, transparent 30%),
          #f5f8f6;
      }

      button, input, select { font: inherit; }
      button { cursor: pointer; }
      [hidden] { display: none !important; }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: #176844;
        font-size: 15px;
        font-weight: 750;
        letter-spacing: 0.02em;
      }

      .brand-mark {
        display: grid;
        width: 36px;
        height: 36px;
        place-items: center;
        border-radius: 12px;
        background: #e5f4eb;
        font-size: 21px;
      }

      .login-page {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .login-card {
        width: min(100%, 430px);
        padding: 40px;
        border: 1px solid #e3ebe6;
        border-radius: 20px;
        background: #fff;
        box-shadow: 0 24px 70px rgb(23 53 43 / 9%);
      }

      h1 {
        margin: 28px 0 8px;
        font-size: clamp(27px, 7vw, 32px);
        letter-spacing: -0.04em;
      }

      .muted { color: #687a72; }

      .login-card > p {
        margin: 0 0 28px;
        font-size: 15px;
        line-height: 1.55;
      }

      form { display: grid; gap: 17px; }

      label {
        display: grid;
        gap: 8px;
        color: #344b41;
        font-size: 13px;
        font-weight: 650;
      }

      input, select {
        width: 100%;
        min-height: 46px;
        padding: 0 12px;
        border: 1px solid #d9e3dd;
        border-radius: 10px;
        outline: none;
        background: #fff;
        color: #17352b;
        font-size: 14px;
        transition: border-color 150ms ease, box-shadow 150ms ease;
      }

      input:focus, select:focus {
        border-color: #27845b;
        box-shadow: 0 0 0 3px rgb(39 132 91 / 14%);
      }

      .button {
        min-height: 43px;
        padding: 0 16px;
        border: 1px solid transparent;
        border-radius: 10px;
        background: #176844;
        color: #fff;
        font-size: 13px;
        font-weight: 700;
        transition: background 150ms ease, transform 150ms ease;
      }

      .button:hover { background: #105437; }
      .button:active { transform: translateY(1px); }
      .button:disabled { cursor: wait; opacity: 0.72; }
      .button.secondary { border-color: #dce6e0; background: #fff; color: #315044; }
      .button.secondary:hover { background: #f3f8f5; }
      .button.small { min-height: 34px; padding: 0 11px; font-size: 12px; }

      .error {
        min-height: 19px;
        margin: 0;
        color: #b42318;
        font-size: 13px;
        line-height: 1.5;
      }

      .success { color: #176844; }

      .login-footnote {
        margin: 22px 0 0;
        color: #7b8b83;
        font-size: 12px;
        text-align: center;
      }

      .app-header {
        position: sticky;
        z-index: 2;
        top: 0;
        display: flex;
        min-height: 72px;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 12px max(24px, calc((100vw - 1120px) / 2));
        border-bottom: 1px solid #e5ede8;
        background: rgb(255 255 255 / 92%);
        backdrop-filter: blur(14px);
      }

      .account {
        display: flex;
        align-items: center;
        gap: 13px;
      }

      .account-info { text-align: right; }
      .account-name { font-size: 13px; font-weight: 700; }
      .account-role { margin-top: 3px; color: #75867e; font-size: 11px; text-transform: capitalize; }

      .workspace {
        width: min(100% - 40px, 1120px);
        margin: 42px auto 80px;
      }

      .welcome {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 26px;
      }

      .welcome h1 { margin: 0 0 7px; font-size: clamp(26px, 5vw, 34px); }
      .welcome p { margin: 0; font-size: 14px; }
      .date-label { color: #75867e; font-size: 12px; }

      .tabs {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        padding: 5px;
        border: 1px solid #e4ece7;
        border-radius: 13px;
        background: rgb(255 255 255 / 78%);
      }

      .tab {
        min-height: 38px;
        flex: 0 0 auto;
        padding: 0 16px;
        border: 0;
        border-radius: 9px;
        background: transparent;
        color: #60736a;
        font-size: 13px;
        font-weight: 650;
      }

      .tab:hover { background: #f2f7f4; color: #176844; }
      .tab.active { background: #176844; color: #fff; }

      .content { min-height: 250px; padding-top: 25px; }
      .section-heading { margin: 0 0 5px; font-size: 20px; letter-spacing: -0.02em; }
      .section-copy { margin: 0 0 20px; color: #75867e; font-size: 13px; line-height: 1.55; }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
        gap: 14px;
      }

      .card, .stat {
        border: 1px solid #e2ebe5;
        border-radius: 14px;
        background: #fff;
        box-shadow: 0 5px 18px rgb(23 53 43 / 3%);
      }

      .card { padding: 18px; }
      .resident-name, .medicine-name { margin: 0; font-size: 15px; font-weight: 720; }
      .card-meta { margin: 7px 0 0; color: #718179; font-size: 12px; line-height: 1.5; }
      .allergy-box {
        margin-top: 13px;
        padding: 10px 12px;
        border: 1px solid #f1d77d;
        border-radius: 9px;
        background: #fff7d6;
        color: #74520a;
        font-size: 12px;
        font-weight: 650;
        line-height: 1.5;
      }
      .resident-medicines { margin: 16px 0 0; padding: 0; list-style: none; }
      .resident-medicines li {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 9px 0;
        border-top: 1px solid #edf1ee;
        color: #344b41;
        font-size: 12px;
      }
      .resident-medicines li span:last-child { color: #718179; text-align: right; }
      .medicine-card { display: grid; gap: 14px; }
      .medicine-card .card-meta { margin-top: 5px; }
      .medicine-card.overdue {
        border-color: #e7aaa5;
        background: #fff8f7;
        box-shadow: 0 5px 18px rgb(165 43 35 / 8%);
      }
      .medicine-card.overdue .card-meta { color: #8c3731; }
      .medicine-footer { display: flex; align-items: center; justify-content: space-between; gap: 10px; }

      .badge {
        display: inline-flex;
        align-items: center;
        min-height: 23px;
        padding: 0 9px;
        border-radius: 999px;
        background: #edf4ef;
        color: #32614b;
        font-size: 11px;
        font-weight: 700;
        text-transform: capitalize;
      }

      .badge.upcoming { background: #edf2f7; color: #536779; }
      .badge.due-now { background: #e4f4e9; color: #176844; }
      .badge.overdue, .badge.refused { background: #fde9e7; color: #a52b23; }
      .badge.given { background: #e4f4e9; color: #176844; }
      .badge.missed { background: #fff1df; color: #97510d; }
      .dose-actions { display: flex; flex-wrap: wrap; gap: 7px; }
      .alert-list {
        display: grid;
        gap: 9px;
        margin-bottom: 22px;
      }
      .alert-empty { margin-bottom: 22px; }
      .alert-item {
        padding: 12px 15px;
        border: 1px solid #e8aaa5;
        border-radius: 11px;
        background: #fff1f0;
        color: #8e2923;
        font-size: 13px;
        font-weight: 650;
        line-height: 1.5;
      }
      .alert-item.low-stock {
        border-color: #edd28e;
        background: #fff8e6;
        color: #79500a;
      }
      .alert-title {
        display: block;
        margin-bottom: 2px;
        font-size: 11px;
        font-weight: 750;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .overview-section { margin-top: 28px; }
      .overview-section .section-heading { margin-bottom: 13px; }
      .resident-progress-list { display: grid; gap: 12px; }
      .resident-progress-item {
        padding: 16px;
        border: 1px solid #e2ebe5;
        border-radius: 12px;
        background: #fff;
      }
      .progress-label {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 9px;
        font-size: 13px;
        font-weight: 650;
      }
      .progress-label span:last-child {
        flex: 0 0 auto;
        color: #60736a;
        font-size: 12px;
        font-weight: 600;
      }
      .progress-track {
        height: 9px;
        overflow: hidden;
        border-radius: 999px;
        background: #e9f0eb;
      }
      .progress-fill {
        height: 100%;
        border-radius: inherit;
        background: #258052;
        transition: width 180ms ease;
      }
      .progress-empty { margin: 0; color: #75867e; font-size: 12px; }
      .button.danger {
        border-color: #f0c8c4;
        background: #fff;
        color: #a52b23;
      }
      .button.danger:hover { background: #fff4f3; }
      .button.warning {
        border-color: #f1d89d;
        background: #fff;
        color: #87530c;
      }
      .button.warning:hover { background: #fff9eb; }

      .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
        gap: 14px;
        margin-bottom: 24px;
      }

      .stat { padding: 17px; }
      .stat-label { color: #708178; font-size: 12px; }
      .stat-value { margin-top: 9px; font-size: 28px; font-weight: 760; letter-spacing: -0.04em; }

      .table-wrap {
        overflow-x: auto;
        border: 1px solid #e2ebe5;
        border-radius: 14px;
        background: #fff;
      }

      table { width: 100%; border-collapse: collapse; text-align: left; }
      th, td { padding: 13px 15px; border-bottom: 1px solid #edf1ee; font-size: 12px; white-space: nowrap; }
      th { color: #718179; font-size: 11px; font-weight: 700; }
      tr:last-child td { border-bottom: 0; }

      .form-card { max-width: 550px; }
      .resident-form { margin-bottom: 20px; }
      .empty, .loading { padding: 32px; border: 1px dashed #d5e1d9; border-radius: 14px; color: #718179; font-size: 13px; text-align: center; }

      @media (max-width: 560px) {
        .login-card { padding: 30px 24px; }
        .app-header { padding: 12px 16px; }
        .app-header .brand { font-size: 13px; }
        .app-header .brand-mark { width: 32px; height: 32px; }
        .account { gap: 8px; }
        .account-name { max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .account .button { min-height: 36px; padding: 0 10px; }
        .workspace { width: min(100% - 28px, 1120px); margin-top: 29px; }
        .welcome { align-items: start; }
        .date-label { display: none; }
        .tab { padding: 0 12px; }
        .progress-label { align-items: start; flex-direction: column; gap: 4px; }
      }

      :root {
        color: #173b3d;
        background: #f2f8f7;
      }

      body {
        color: #173b3d;
        background:
          radial-gradient(ellipse at 12% 18%, #dcefed 0, transparent 34%),
          radial-gradient(ellipse at 92% 84%, #e4f0ef 0, transparent 30%),
          #f2f8f7;
      }

      .brand { color: #075e5a; font-size: 17px; }
      .brand-mark { background: #dcefed; }
      .login-card { border-color: #c9dcda; }
      h1 { color: #173b3d; }
      .muted, .section-copy, .date-label, .account-role,
      .card-meta, .progress-empty, .stat-label, th {
        color: #4c6465;
      }
      label { color: #294747; font-size: 16px; }
      input, select {
        min-height: 52px;
        padding: 0 14px;
        border-color: #a9c1be;
        color: #173b3d;
        font-size: 16px;
      }
      input:focus, select:focus {
        border-color: #075e5a;
        box-shadow: 0 0 0 3px rgb(7 94 90 / 18%);
      }
      .button {
        min-height: 50px;
        background: #075e5a;
        font-size: 16px;
      }
      .button:hover { background: #064b48; }
      .button.secondary { border-color: #9fb9b6; color: #174b49; }
      .button.secondary:hover { background: #eaf3f2; }
      .button.small { min-height: 48px; padding: 0 14px; font-size: 15px; }
      .error { color: #8c241d; font-size: 16px; }
      .error:not(:empty) {
        padding: 11px 13px;
        border: 1px solid #d99a94;
        border-radius: 9px;
        background: #fde5e2;
        color: #76201b;
      }
      .success { color: #145c36; }
      .login-footnote { color: #4c6465; font-size: 14px; }
      .app-header {
        border-bottom-color: #c9dcda;
        background: rgb(255 255 255 / 96%);
      }
      .account-name { font-size: 16px; }
      .account-role { font-size: 14px; }
      .welcome h1 { font-size: clamp(29px, 5vw, 36px); }
      .welcome p { font-size: 16px; }
      .tabs {
        flex-wrap: wrap;
        overflow: visible;
        border-color: #c4d8d5;
        background: #fff;
      }
      .tab {
        min-height: 48px;
        padding: 0 17px;
        color: #365354;
        font-size: 16px;
      }
      .tab:hover { background: #e7f2f1; color: #064b48; }
      .tab[aria-current="page"] { background: #075e5a; color: #fff; }
      .content { min-width: 0; }
      .section-heading { color: #173b3d; font-size: 24px; }
      .section-copy { font-size: 16px; }
      .card, .stat {
        min-width: 0;
        border-color: #c9dcda;
        box-shadow: 0 5px 18px rgb(23 59 61 / 5%);
      }
      .card { padding: 20px; }
      .resident-name, .medicine-name { font-size: 19px; line-height: 1.4; }
      .card-meta { font-size: 16px; overflow-wrap: anywhere; }
      .allergy-box {
        border-color: #c89421;
        background: #fff0b8;
        color: #573800;
        font-size: 16px;
      }
      .resident-medicines li {
        color: #294747;
        font-size: 15px;
        overflow-wrap: anywhere;
      }
      .resident-medicines li span { min-width: 0; }
      .resident-medicines li span:last-child { color: #4c6465; }
      .medicine-card.overdue {
        border-color: #cc7169;
        background: #fff4f2;
      }
      .medicine-card.overdue .card-meta { color: #76201b; }
      .medicine-footer { min-width: 0; flex-wrap: wrap; }
      .badge {
        min-height: 32px;
        padding: 4px 12px;
        background: #e8f0ef;
        color: #294747;
        font-size: 15px;
      }
      .badge.upcoming { background: #e7edf2; color: #34495a; }
      .badge.due-now, .badge.given { background: #ddf3e4; color: #145c36; }
      .badge.overdue, .badge.refused { background: #fde5e2; color: #76201b; }
      .badge.missed { background: #fff0b8; color: #573800; }
      .dose-actions { gap: 9px; }
      .alert-list { gap: 12px; }
      .alert-item {
        padding: 15px 17px;
        border-color: #cc7169;
        background: #fde5e2;
        color: #76201b;
        font-size: 16px;
      }
      .alert-item.low-stock {
        border-color: #c89421;
        background: #fff0b8;
        color: #573800;
      }
      .alert-title { font-size: 14px; }
      .overview-section .section-heading { font-size: 22px; }
      .resident-progress-item { border-color: #c9dcda; }
      .progress-label { font-size: 16px; }
      .progress-label span:last-child { color: #365354; font-size: 15px; }
      .progress-track { height: 12px; background: #dce8e6; }
      .progress-fill { background: #17653f; }
      .button.danger {
        border-color: #cb837c;
        color: #76201b;
      }
      .button.danger:hover { background: #fde5e2; }
      .button.warning {
        border-color: #c89421;
        color: #573800;
      }
      .button.warning:hover { background: #fff0b8; }
      .stats { grid-template-columns: repeat(auto-fit, minmax(135px, 1fr)); gap: 12px; }
      .stat { padding: 18px; }
      .stat-label { font-size: 15px; line-height: 1.4; }
      .stat-value { color: #173b3d; font-size: 34px; }
      .table-wrap {
        overflow: visible;
        border-color: #c9dcda;
      }
      table { color: #173b3d; }
      th, td {
        padding: 15px;
        border-bottom-color: #dbe7e5;
        font-size: 15px;
        white-space: normal;
        overflow-wrap: anywhere;
      }
      th { color: #365354; font-size: 14px; }
      .empty, .loading {
        border-color: #afc7c4;
        color: #4c6465;
        font-size: 16px;
        line-height: 1.5;
      }
      :focus-visible { outline: 3px solid #075e5a; outline-offset: 3px; }

      @media (max-width: 600px) {
        .app-header { gap: 8px; padding: 10px 14px; }
        .app-header .brand { gap: 7px; font-size: 16px; }
        .app-header .brand-mark { width: 34px; height: 34px; }
        .account { gap: 8px; }
        .account-name { max-width: 94px; font-size: 14px; }
        .account-role { font-size: 12px; }
        .account .button { min-height: 48px; padding: 0 12px; }
        .workspace { width: calc(100% - 28px); margin: 24px auto 48px; }
        .welcome { margin-bottom: 20px; }
        .tabs { gap: 6px; padding: 7px; }
        .tab { flex: 1 1 auto; padding: 0 11px; }
        .content { padding-top: 21px; }
        .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
        .stat { padding: 14px; }
        .stat-label { font-size: 14px; }
        .stat-value { margin-top: 7px; font-size: 32px; }
        .grid { grid-template-columns: minmax(0, 1fr); gap: 12px; }
        .card { padding: 17px; }
        .medicine-footer { align-items: flex-start; flex-direction: column; }
        .dose-actions { display: grid; width: 100%; grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .dose-actions .button { width: 100%; padding: 0 8px; }
        .progress-label { align-items: flex-start; flex-direction: column; gap: 5px; }
        .login-page { padding: 16px; }
        .login-card { padding: 28px 22px; }
        .table-wrap { border: 0; background: transparent; }
        table, tbody, tr, td { display: block; width: 100%; }
        thead { display: none; }
        tr {
          margin-bottom: 12px;
          padding: 8px 14px;
          border: 1px solid #c9dcda;
          border-radius: 12px;
          background: #fff;
          box-shadow: 0 4px 14px rgb(23 59 61 / 4%);
        }
        tr:last-child { margin-bottom: 0; }
        th, td { border: 0; }
        td {
          display: grid;
          grid-template-columns: minmax(66px, 0.32fr) minmax(0, 1fr);
          gap: 10px;
          padding: 9px 0;
        }
        td::before {
          content: attr(data-label);
          color: #365354;
          font-size: 14px;
          font-weight: 700;
        }
      }

      @media (max-width: 370px) {
        .app-header { flex-wrap: wrap; }
        .account { margin-left: auto; }
        .account-name { max-width: 80px; }
        .welcome h1 { font-size: 28px; }
        .tab { min-width: 42%; }
        .dose-actions { grid-template-columns: minmax(0, 1fr); }
      }
    </style>
  </head>
  <body>
    <section id="login-page" class="login-page">
      <main class="login-card">
        <div class="brand"><span class="brand-mark" aria-hidden="true">+</span> CareDose</div>
        <h1>Welcome back</h1>
        <p class="muted">Sign in to securely continue to your care team.</p>
        <form id="login-form">
          <label for="role">
            I am a
            <select id="role" name="role" required>
              <option value="nurse">Nurse</option>
              <option value="doctor">Doctor</option>
            </select>
          </label>
          <label for="email">
            Email address
            <input id="email" name="email" type="email" autocomplete="username" required>
          </label>
          <label for="password">
            Password
            <input id="password" name="password" type="password" autocomplete="current-password" required>
          </label>
          <p id="login-error" class="error" role="alert" aria-live="polite"></p>
          <button id="login-submit" class="button" type="submit">Sign in</button>
        </form>
        <p class="login-footnote">Your sign-in pass expires after 8 hours.</p>
      </main>
    </section>

    <div id="app" hidden>
      <header class="app-header">
        <div class="brand"><span class="brand-mark" aria-hidden="true">+</span> CareDose</div>
        <div class="account">
          <div class="account-info">
            <div id="account-name" class="account-name"></div>
            <div id="account-role" class="account-role"></div>
          </div>
          <button id="sign-out" class="button secondary small" type="button">Sign out</button>
        </div>
      </header>
      <main class="workspace">
        <div class="welcome">
          <div>
            <h1 id="page-title"></h1>
            <p class="muted">Care, clearly coordinated.</p>
          </div>
          <div id="today-date" class="date-label"></div>
        </div>
        <nav id="tabs" class="tabs" aria-label="Dashboard sections"></nav>
        <section id="content" class="content" aria-live="polite"></section>
      </main>
    </div>

    <script>
      const loginPage = document.querySelector("#login-page");
      const loginForm = document.querySelector("#login-form");
      const loginError = document.querySelector("#login-error");
      const loginSubmit = document.querySelector("#login-submit");
      const app = document.querySelector("#app");
      const tabsElement = document.querySelector("#tabs");
      const content = document.querySelector("#content");
      const tokenKey = "caredoseLogin";
      const nurseTabs = ["Today", "Residents", "Log"];
      const doctorTabs = ["Overview", "Residents", "Prescribe", "Staff", "Log"];
      let login = null;
      let activeTab = "";

      function escapeHtml(value) {
        return String(value ?? "").replace(/[&<>"']/g, (character) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;",
        })[character]);
      }

      function showLogin(message = "") {
        login = null;
        sessionStorage.removeItem(tokenKey);
        app.hidden = true;
        loginPage.hidden = false;
        loginError.textContent = message;
        loginForm.elements.password.value = "";
      }

      async function apiRequest(url, options = {}) {
        const headers = new Headers(options.headers || {});
        headers.set("Authorization", `Bearer ${login.token}`);
        if (options.body) headers.set("Content-Type", "application/json");
        const response = await fetch(url, { ...options, headers });
        const result = await response.json();
        if (response.status === 401) {
          showLogin(result.error || "Your sign-in pass has expired. Please sign in again.");
          throw new Error(result.error || "Please sign in again.");
        }
        if (!response.ok) throw new Error(result.error || "The request could not be completed.");
        return result;
      }

      function setLogin(result) {
        login = result;
        sessionStorage.setItem(tokenKey, JSON.stringify(result));
        loginPage.hidden = true;
        app.hidden = false;
        const role = result.user.role;
        document.querySelector("#account-name").textContent = result.user.name;
        document.querySelector("#account-role").textContent = role;
        document.querySelector("#page-title").textContent =
          `${role === "nurse" ? "Nurse" : "Doctor"} screen`;
        document.querySelector("#today-date").textContent =
          new Intl.DateTimeFormat(undefined, { weekday: "long", month: "long", day: "numeric" }).format(new Date());
        renderTabs();
        openTab(role === "nurse" ? "Today" : "Overview");
      }

      function renderTabs() {
        const allowedTabs = login.user.role === "nurse" ? nurseTabs : doctorTabs;
        tabsElement.replaceChildren(...allowedTabs.map((name) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "tab";
          button.textContent = name;
          button.dataset.tab = name;
          button.setAttribute("aria-current", name === activeTab ? "page" : "false");
          return button;
        }));
      }

      function setContent(html) {
        content.innerHTML = html;
      }

      function showContentError(error) {
        setContent(`<div class="error" role="alert">${escapeHtml(error.message)}</div>`);
      }

      async function openTab(name) {
        const allowedTabs = login.user.role === "nurse" ? nurseTabs : doctorTabs;
        if (!allowedTabs.includes(name)) return;
        activeTab = name;
        renderTabs();
        setContent('<div class="loading">Loading…</div>');

        try {
          if (name === "Today") await renderToday();
          else if (name === "Residents") await renderResidents();
          else if (name === "Log") await renderLog();
          else if (name === "Overview") await renderOverview();
          else if (name === "Staff") await renderStaff();
          else if (name === "Prescribe") await renderPrescribe();
        } catch (error) {
          if (login) showContentError(error);
        }
      }

      async function renderToday() {
        const { doses, counts } = await apiRequest("/api/nurse/today");
        setContent(`
          <h2 class="section-heading">Today</h2>
          <p class="section-copy">Daily medication schedule for active residents.</p>
          <div class="stats">
            <article class="stat"><div class="stat-label">Given</div><div class="stat-value">${counts.given}</div></article>
            <article class="stat"><div class="stat-label">Still to give</div><div class="stat-value">${counts.stillToGive}</div></article>
            <article class="stat"><div class="stat-label">Overdue</div><div class="stat-value">${counts.overdue}</div></article>
            <article class="stat"><div class="stat-label">Missed</div><div class="stat-value">${counts.missed}</div></article>
            <article class="stat"><div class="stat-label">Refused</div><div class="stat-value">${counts.refused}</div></article>
          </div>
          ${doses.length ? `<div class="grid">${doses.map((dose) => `
            <article class="card medicine-card ${dose.status_label === "Overdue" ? "overdue" : ""}">
              <div>
                <p class="card-meta">Scheduled ${escapeHtml(dose.scheduled_time.slice(0, 5))}</p>
                <h3 class="medicine-name">${escapeHtml(dose.drug_name)}${dose.strength
                  ? ` <span class="card-meta">${escapeHtml(dose.strength)}</span>`
                  : ""}</h3>
                <p class="card-meta">${escapeHtml(dose.resident_name)} · Room ${escapeHtml(dose.room)}</p>
                <p class="card-meta">${escapeHtml(dose.stock_left)} in stock</p>
                <div class="allergy-box">${dose.allergy
                  ? `Allergy: ${escapeHtml(dose.allergy)}`
                  : "No known allergies"}</div>
              </div>
              <div class="medicine-footer">
                <span class="badge ${dose.status_label.toLowerCase().replaceAll(" ", "-")}">${escapeHtml(dose.status_label)}</span>
                ${dose.status === "pending" ? `
                  <div class="dose-actions">
                    <button class="button small" type="button" data-dose-id="${dose.medicine_id}" data-dose-status="given">Mark given</button>
                    <button class="button small danger" type="button" data-dose-id="${dose.medicine_id}" data-dose-status="refused">Refused</button>
                    <button class="button small warning" type="button" data-dose-id="${dose.medicine_id}" data-dose-status="missed">Missed</button>
                  </div>` : ""}
              </div>
            </article>`).join("")}</div>` : '<div class="empty">No active medicines are scheduled today.</div>'}`);
      }

      async function renderResidents() {
        const { residents } = await apiRequest("/api/residents");
        const canAddResident = login.user.role === "doctor";
        setContent(`
          <h2 class="section-heading">Residents</h2>
          <p class="section-copy">Resident details, allergies, and medication schedules.</p>
          ${canAddResident ? `
            <form id="resident-form" class="card form-card resident-form">
              <h3 class="resident-name">Add a resident</h3>
              <label for="resident-name">Full name
                <input id="resident-name" name="name" maxlength="120" autocomplete="off" required>
              </label>
              <label for="resident-age">Age
                <input id="resident-age" name="age" type="number" min="0" max="120" step="1" required>
              </label>
              <label for="resident-room">Room
                <input id="resident-room" name="room" maxlength="40" autocomplete="off" required>
              </label>
              <label for="resident-allergy">Allergies <span class="muted">(optional)</span>
                <input id="resident-allergy" name="allergy" maxlength="500" autocomplete="off">
              </label>
              <p id="resident-message" class="error" role="alert" aria-live="polite"></p>
              <button class="button" type="submit">Add resident</button>
            </form>` : ""}
          ${residents.length ? `<div class="grid">${residents.map((resident) => `
            <article class="card">
              <h3 class="resident-name">${escapeHtml(resident.name)}</h3>
              <p class="card-meta">Age ${resident.age} · Room ${escapeHtml(resident.room)}</p>
              <div class="allergy-box">${resident.allergy
                ? `Allergy: ${escapeHtml(resident.allergy)}`
                : "No known allergies"}</div>
              <h4 class="card-meta" style="font-weight:700">Medicines</h4>
              ${resident.medicines.length
                ? `<ul class="resident-medicines">${resident.medicines.map((medicine) => `
                  <li>
                    <span>${escapeHtml(medicine.drug_name)}${medicine.active ? "" : " (inactive)"}</span>
                    <span>${escapeHtml(medicine.strength ? `${medicine.strength} · ` : "")}${escapeHtml(medicine.time_of_day)} · ${medicine.stock_left} left</span>
                  </li>`).join("")}</ul>`
                : '<p class="card-meta">No medicines listed</p>'}
            </article>`).join("")}</div>` : '<div class="empty">No residents have been added.</div>'}`);
      }

      async function renderOverview() {
        const overview = await apiRequest("/api/doctor/overview");
        const alerts = overview.alerts.length
          ? `<div class="alert-list" aria-label="Care alerts">
              ${overview.alerts.map((alert) => `
                <article class="alert-item ${alert.severity === "warning" ? "low-stock" : ""}">
                  <span class="alert-title">${alert.type === "overdue" ? "Overdue dose" : "Low stock"}</span>
                  ${escapeHtml(alert.message)}
                </article>`).join("")}
            </div>`
          : '<div class="empty">No overdue doses or low-stock medicines.</div>';
        setContent(`
          <h2 class="section-heading">Overview</h2>
          <p class="section-copy">Today’s dose progress and items that need attention.</p>
          <div class="stats">
            <article class="stat"><div class="stat-label">Given</div><div class="stat-value">${overview.counts.given}</div></article>
            <article class="stat"><div class="stat-label">Still to give</div><div class="stat-value">${overview.counts.stillToGive}</div></article>
            <article class="stat"><div class="stat-label">Overdue</div><div class="stat-value">${overview.counts.overdue}</div></article>
            <article class="stat"><div class="stat-label">Missed</div><div class="stat-value">${overview.counts.missed}</div></article>
            <article class="stat"><div class="stat-label">Refused</div><div class="stat-value">${overview.counts.refused}</div></article>
          </div>
          <section class="overview-section" aria-labelledby="needs-attention-heading">
            <h3 id="needs-attention-heading" class="section-heading">Needs attention</h3>
            ${alerts}
          </section>
          <section class="overview-section" aria-labelledby="resident-progress-heading">
            <h3 id="resident-progress-heading" class="section-heading">Today by resident</h3>
            ${overview.residents.length ? `<div class="resident-progress-list">
              ${overview.residents.map((resident) => `
                <article class="resident-progress-item">
                  ${resident.progress_percent === null
                    ? `<p class="progress-label"><span>${escapeHtml(resident.name)} · Room ${escapeHtml(resident.room)}</span></p>
                       <p class="progress-empty">No doses scheduled today</p>`
                    : `<div class="progress-label">
                         <span>${escapeHtml(resident.name)} · Room ${escapeHtml(resident.room)}</span>
                         <span>${resident.progress_percent}% · ${resident.given_count} of ${resident.dose_count} given</span>
                       </div>
                       <div class="progress-track" role="progressbar"
                         aria-label="${escapeHtml(resident.name)} today dose progress"
                         aria-valuemin="0" aria-valuemax="100"
                         aria-valuenow="${resident.progress_percent}"
                         aria-valuetext="${resident.given_count} of ${resident.dose_count} doses given">
                         <div class="progress-fill" style="width: ${resident.progress_percent}%"></div>
                       </div>`}
                </article>`).join("")}
            </div>` : '<div class="empty">No residents have been added.</div>'}
          </section>`);
      }

      async function renderStaff() {
        const { staff } = await apiRequest("/api/doctor/staff");
        setContent(`
          <h2 class="section-heading">Staff</h2>
          <p class="section-copy">CareDose staff accounts.</p>
          <form id="staff-form" class="card form-card resident-form">
            <h3 class="resident-name">Create a nurse account</h3>
            <label for="staff-name">Full name
              <input id="staff-name" name="name" maxlength="120" autocomplete="name" required>
            </label>
            <label for="staff-email">Email address
              <input id="staff-email" name="email" type="email" maxlength="254" autocomplete="email" required>
            </label>
            <label for="staff-password">Initial password
              <input id="staff-password" name="password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required>
            </label>
            <p id="staff-message" class="error" role="alert" aria-live="polite"></p>
            <button class="button" type="submit">Create nurse</button>
          </form>
          <div class="table-wrap"><table>
            <thead><tr><th>Name</th><th>Email</th><th>Role</th></tr></thead>
            <tbody>${staff.map((member) => `<tr>
              <td data-label="Name">${escapeHtml(member.name)}</td>
              <td data-label="Email">${escapeHtml(member.email)}</td>
              <td data-label="Role"><span class="badge">${escapeHtml(member.role)}</span></td>
            </tr>`).join("")}</tbody>
          </table></div>`);
      }

      async function renderLog() {
        const { entries } = await apiRequest("/api/log");
        setContent(`
          <h2 class="section-heading">Log</h2>
          <p class="section-copy">This is the record used for checking mistakes. The doctor can review the latest 100 actions across CareDose.</p>
          ${entries.length ? `<div class="table-wrap"><table>
            <thead><tr><th>When</th><th>Who</th><th>Action</th></tr></thead>
            <tbody>${entries.map((entry) => `<tr>
              <td data-label="When">${escapeHtml(new Date(`${entry.occurred_at.replace(" ", "T")}Z`).toLocaleString())}</td>
              <td data-label="Who">${escapeHtml(entry.user_name || "System")}</td>
              <td data-label="Action">${escapeHtml(entry.action)}</td>
            </tr>`).join("")}</tbody>
          </table></div>` : '<div class="empty">No actions have been recorded yet.</div>'}`);
      }

      async function renderPrescribe() {
        const { residents } = await apiRequest("/api/residents");
        setContent(`
          <h2 class="section-heading">Prescribe</h2>
          <p class="section-copy">Add an active medicine to a resident's schedule.</p>
          <form id="prescribe-form" class="card form-card">
            <label for="prescribe-resident">Resident
              <select id="prescribe-resident" name="residentId" required>${residents.map((resident) =>
                `<option value="${resident.id}">${escapeHtml(resident.name)} · Room ${escapeHtml(resident.room)}</option>`
              ).join("")}</select>
            </label>
            <label for="drug-name">Medicine
              <input id="drug-name" name="drugName" maxlength="120" required>
            </label>
            <label for="medicine-strength">Strength
              <input id="medicine-strength" name="strength" maxlength="80" placeholder="e.g. 500 mg" required>
            </label>
            <label for="time-of-day">Time of day
              <select id="time-of-day" name="timeOfDay" required>
                <option value="morning">Morning</option>
                <option value="afternoon">Afternoon</option>
                <option value="evening">Evening</option>
                <option value="bedtime">Bedtime</option>
              </select>
            </label>
            <label for="stock-left">Starting stock
              <input id="stock-left" name="stockLeft" type="number" min="0" step="1" value="0" required>
            </label>
            <p id="prescribe-message" class="error" role="alert" aria-live="polite"></p>
            <button class="button" type="submit">Add prescription</button>
          </form>`);
      }

      loginForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        loginError.textContent = "";
        loginSubmit.disabled = true;
        loginSubmit.textContent = "Signing in…";
        try {
          const response = await fetch("/api/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              role: loginForm.elements.role.value,
              email: loginForm.elements.email.value,
              password: loginForm.elements.password.value,
            }),
          });
          const result = await response.json();
          if (!response.ok) {
            loginError.textContent = result.error || "Unable to sign in. Please try again.";
            return;
          }
          loginForm.elements.password.value = "";
          setLogin(result);
        } catch {
          loginError.textContent = "Unable to reach CareDose. Check your connection and try again.";
        } finally {
          loginSubmit.disabled = false;
          loginSubmit.textContent = "Sign in";
        }
      });

      tabsElement.addEventListener("click", (event) => {
        const tab = event.target.closest("[data-tab]");
        if (tab) openTab(tab.dataset.tab);
      });

      content.addEventListener("click", async (event) => {
        const button = event.target.closest("[data-dose-id][data-dose-status]");
        if (!button) return;
        button.disabled = true;
        try {
          await apiRequest("/api/nurse/doses", {
            method: "POST",
            body: JSON.stringify({
              medicineId: Number(button.dataset.doseId),
              status: button.dataset.doseStatus,
            }),
          });
          await openTab("Today");
        } catch (error) {
          if (login) {
            button.disabled = false;
            showContentError(error);
          }
        }
      });

      content.addEventListener("submit", async (event) => {
        if (!["prescribe-form", "resident-form", "staff-form"].includes(event.target.id)) return;
        event.preventDefault();
        const form = event.target;
        const isResidentForm = form.id === "resident-form";
        const isStaffForm = form.id === "staff-form";
        const messageId = isResidentForm
          ? "#resident-message"
          : isStaffForm
            ? "#staff-message"
            : "#prescribe-message";
        const message = form.querySelector(messageId);
        const button = form.querySelector("button[type=submit]");
        button.disabled = true;
        message.textContent = "";
        message.classList.remove("success");
        try {
          const route = isResidentForm
            ? "/api/doctor/residents"
            : isStaffForm
              ? "/api/doctor/staff"
              : "/api/doctor/medicines";
          const body = isResidentForm
            ? {
              name: form.elements.name.value,
              age: Number(form.elements.age.value),
              room: form.elements.room.value,
              allergy: form.elements.allergy.value,
            }
            : isStaffForm
              ? {
                name: form.elements.name.value,
                email: form.elements.email.value,
                password: form.elements.password.value,
              }
              : {
              residentId: Number(form.elements.residentId.value),
              drugName: form.elements.drugName.value,
              strength: form.elements.strength.value,
              timeOfDay: form.elements.timeOfDay.value,
              stockLeft: Number(form.elements.stockLeft.value),
            };
          await apiRequest(route, {
            method: "POST",
            body: JSON.stringify(body),
          });
          message.classList.add("success");
          if (isResidentForm) {
            await renderResidents();
          } else if (isStaffForm) {
            await renderStaff();
            const staffMessage = content.querySelector("#staff-message");
            staffMessage.classList.add("success");
            staffMessage.textContent = "Nurse created.";
          } else {
            message.textContent = "Prescription saved.";
            form.reset();
            form.elements.stockLeft.value = "0";
          }
        } catch (error) {
          message.textContent = error.message;
        } finally {
          button.disabled = false;
        }
      });

      document.querySelector("#sign-out").addEventListener("click", () => {
        showLogin();
      });

      async function restoreSession() {
        try {
          const saved = JSON.parse(sessionStorage.getItem(tokenKey) || "null");
          if (!saved?.token) return showLogin();
          login = saved;
          const result = await apiRequest("/api/me");
          setLogin({ ...saved, user: result.user });
        } catch {
          showLogin("Your sign-in pass has expired. Please sign in again.");
        }
      }

      restoreSession();
    </script>
  </body>
</html>
